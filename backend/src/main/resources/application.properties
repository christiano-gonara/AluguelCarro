spring.application.name=aluguel-carro
server.port=${PORT:8080}

# Banco de dados: Supabase (PostgreSQL). Valores vêm de variáveis de ambiente (veja .env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Sessão (login com usuário e senha)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Dados iniciais opcionais (agentes e alguns carros) para desenvolvimento
app.seed.enabled=${SEED_ENABLED:false}
app.seed.agent-password=${SEED_AGENT_PASSWORD:}
