<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada · Aluga.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Página que o GitHub Pages mostra quando o endereço não existe. Gerada no build com o endereço base certo. */
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #1e241b; color: #fff; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; }
      header { max-width: 1280px; width: 100%; margin: 0 auto; padding: 1.75rem 3rem; display: flex; align-items: center; gap: 1.25rem; }
      a { color: #fff; }
      .voltar, .btn { display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; padding: 0 1.1rem 0 .85rem; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); font-size: .9rem; font-weight: 600; text-decoration: none; transition: transform .35s cubic-bezier(.22,1,.36,1), background-color .2s ease; }
      .voltar:hover, .btn:hover { transform: translateY(-3px); background: rgba(255,255,255,.14); }
      .btn.principal { background: #fff; color: #1a2027; border-color: #fff; padding: 0 1.4rem; border-radius: 10px; }
      .marca { display: inline-flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.2rem; text-decoration: none; }
      main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; padding: 2rem 1.5rem 5rem; text-align: center; }
      .codigo { display: flex; align-items: center; gap: .5rem; margin: 0; font-size: clamp(6rem, 18vw, 12rem); font-weight: 600; line-height: 1; letter-spacing: -.04em; color: #d4d9d0; }
      .codigo img { width: clamp(9rem, 26vw, 18rem); filter: drop-shadow(0 22px 18px rgba(0,0,0,.55)); transform: rotate(-8deg); }
      h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); }
      p { margin: 0; max-width: 30rem; color: #c9cfc4; line-height: 1.6; }
      .linha { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: .5rem; }
      @media (max-width: 640px) { header { padding: 1.25rem; } }
      @media (prefers-reduced-motion: reduce) { .voltar, .btn { transition: none; } .voltar:hover, .btn:hover { transform: none; } }
    </style>
  </head>
  <body>
    <header>
      <a class="voltar" href="javascript:history.back()">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7L5 12L10 17M5 12H19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
        Voltar
      </a>
      <a class="marca" href="%BASE%">Aluga.</a>
    </header>
    <main>
      <p class="codigo" aria-hidden="true">4<img src="%BASE%carros/onix.png" alt="" />4</p>
      <h1>Essa página saiu pra dar uma volta</h1>
      <p>O endereço pode estar errado, ou a página mudou de lugar. Confere o link ou volte pro começo.</p>
      <div class="linha">
        <a class="btn principal" href="%BASE%">Ir pro começo</a>
        <a class="btn" href="%BASE%#/login">Entrar</a>
      </div>
    </main>
  </body>
</html>
